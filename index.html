<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Трекер привычек</title>

  <!-- Подключаем стили и скрипт Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ========== НАВИГАЦИЯ ========== -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('habits')" id="nav-habits">
      <span class="nav-icon">✓</span>
      <span>Привычки</span>
    </button>
    <button class="nav-btn" onclick="showPage('progress')" id="nav-progress">
      <span class="nav-icon">📊</span>
      <span>Прогресс</span>
    </button>
    <button class="nav-btn" onclick="showPage('achievements')" id="nav-achievements">
      <span class="nav-icon">🏆</span>
      <span>Награды</span>
    </button>
  </nav>

  <!-- ========== СТРАНИЦА 1: ПРИВЫЧКИ ========== -->
  <div id="page-habits" class="page active">
    <div class="page-header">
      <h1>Мои привычки</h1>
      <!-- Навигация по дням: стрелки + дата -->
      <div class="date-nav">
        <button class="date-arrow" onclick="changeDay(-1)">‹</button>
        <div class="date-nav-center" onclick="goToToday()">
          <div class="today-label" id="today-label"></div>
          <div class="today-back-hint" id="today-back-hint"></div>
        </div>
        <button class="date-arrow" onclick="changeDay(1)" id="btn-next-day">›</button>
      </div>
    </div>

    <!-- Список привычек (заполняется через JS) -->
    <div id="habits-list" class="habits-list"></div>

    <!-- Кнопка "Добавить привычку" -->
    <button class="add-btn" onclick="openAddModal()">+ Добавить привычку</button>
  </div>

  <!-- ========== СТРАНИЦА 2: ПРОГРЕСС ========== -->
  <div id="page-progress" class="page">
    <div class="page-header">
      <h1>Прогресс</h1>
      <!-- Переключатель периода — выпадающий список -->
      <select class="period-select" onchange="selectPeriod(parseInt(this.value))">
        <option value="7">1 неделя</option>
        <option value="14">2 недели</option>
        <option value="30">1 месяц</option>
        <option value="90">3 месяца</option>
        <option value="180">6 месяцев</option>
        <option value="365">1 год</option>
      </select>
    </div>

    <!-- Список прогресса (заполняется через JS) -->
    <div id="progress-list" class="progress-list"></div>
  </div>

  <!-- ========== СТРАНИЦА 3: ДОСТИЖЕНИЯ ========== -->
  <div id="page-achievements" class="page">
    <div class="page-header">
      <h1>Достижения</h1>
      <div class="ach-subtitle" id="ach-subtitle"></div>
    </div>
    <div id="achievements-list"></div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО: ДОБАВИТЬ ПРИВЫЧКУ ========== -->
  <div id="add-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <h2>Новая привычка</h2>

      <!-- Поле названия -->
      <label for="habit-name">Название</label>
      <input type="text" id="habit-name" placeholder="Например: Читать 30 минут" maxlength="50" />

      <!-- Выбор цели -->
      <label for="habit-goal">Цель</label>
      <select id="habit-goal">
        <option value="7">1 неделя</option>
        <option value="14">2 недели</option>
        <option value="30" selected>1 месяц</option>
        <option value="180">6 месяцев</option>
        <option value="365">1 год</option>
      </select>

      <!-- Кнопки -->
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
        <button class="btn-save" onclick="saveHabit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО: ОПЦИИ ПРИВЫЧКИ ========== -->
  <div id="options-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
      <h2 id="options-modal-title">Привычка</h2>

      <!-- Редактировать -->
      <button class="option-btn" onclick="openEditModal()">
        ✏️ Редактировать
      </button>

      <!-- Удалить привычку -->
      <button class="option-btn danger" onclick="deleteHabit()">
        🗑️ Удалить привычку
      </button>

      <button class="btn-cancel" style="width:100%;margin-top:8px" onclick="closeOptionsModal()">Закрыть</button>
    </div>
  </div>

  <!-- ========== МОДАЛЬНОЕ ОКНО: РЕДАКТИРОВАТЬ ПРИВЫЧКУ ========== -->
  <div id="edit-modal" class="modal-overlay">
    <div class="modal">
      <h2>Редактировать</h2>

      <label for="edit-name">Название</label>
      <input type="text" id="edit-name" maxlength="50" />

      <label for="edit-goal">Цель</label>
      <select id="edit-goal">
        <option value="7">1 неделя</option>
        <option value="14">2 недели</option>
        <option value="30">1 месяц</option>
        <option value="90">3 месяца</option>
        <option value="180">6 месяцев</option>
        <option value="365">1 год</option>
      </select>

      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeEditModal()">Отмена</button>
        <button class="btn-save" onclick="saveEdit()">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Подключаем наш главный скрипт -->
  <script src="js/app.js"></script>
</body>
</html>
